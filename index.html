<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Tổ May - TV Zoom Display</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating Interactive Zoom Controls Bar -->
<div class="zoom-bar" id="zoom-bar">
  <button class="zoom-btn" id="btn-zoom-out" title="Thu nhỏ (Zoom Out)"><i class="fa-solid fa-minus"></i></button>
  <span class="zoom-level-text" id="zoom-text" title="Bấm để reset tỷ lệ">125%</span>
  <button class="zoom-btn" id="btn-zoom-in" title="Phóng to (Zoom In)"><i class="fa-solid fa-plus"></i></button>
  <button class="zoom-btn" id="btn-reset" title="Tỷ lệ chuẩn (100%)"><i class="fa-solid fa-rotate-left"></i></button>
  <button class="zoom-btn" id="btn-fullscreen" title="Toàn màn hình (F11)"><i class="fa-solid fa-expand"></i></button>
</div>

<div id="stage">
  <iframe id="sheet-1" class="sheet-frame active" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSDfrqrVWu2A_mLRBUDoeKyzIzLDp3eC2ttAM8zR-6_KfVzcI97VIBKWDKNzpIWbysSub5OSBlpnzUy/pubhtml?gid=1374437410&single=true&widget=false&headers=false&chrome=false" allowfullscreen></iframe>
  <iframe id="sheet-2" class="sheet-frame" src="about:blank" allowfullscreen></iframe>
</div>

<script src="script.js"></script>
</body>
</html>
